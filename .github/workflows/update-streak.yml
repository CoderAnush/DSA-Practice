name: Update practice streak

on:
  push:
    paths-ignore:
      - "docs/assets/practice-streak-board.svg"
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-practice-streak
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate streak board
        run: python scripts/update_streak.py

      - name: Commit updated board
        run: |
          if git diff --quiet -- docs/assets/practice-streak-board.svg; then
            echo "Streak board is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/practice-streak-board.svg
          git commit -m "chore: update practice streak [skip ci]"
          git push
